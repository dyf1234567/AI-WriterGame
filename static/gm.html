<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GM 后台 · 双界录</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; font-family: "Microsoft YaHei UI", sans-serif;
    background: #0b1118; color: #dce6f2; min-height: 100vh;
  }
  h1 { font-size: 20px; color: #ffd166; margin: 0 0 4px; }
  .sub { color: #7c8ba1; font-size: 13px; margin-bottom: 18px; }
  .grid { display: flex; flex-direction: column; gap: 12px; max-width: 980px; }
  .card {
    background: #121b26; border: 1px solid #223140; border-radius: 12px; padding: 14px 16px;
  }
  .row1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .nm { font-size: 16px; font-weight: 700; color: #7fd8c8; }
  .tag { font-size: 11px; color: #8fa3ba; border: 1px solid #2a3b4d; border-radius: 8px; padding: 1px 8px; }
  .tag.known { color: #ffd166; border-color: #5a4a22; }
  .fld { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .fld label { flex: 0 0 72px; font-size: 12px; color: #8fa3ba; }
  input, textarea {
    background: #0d141d; border: 1px solid #2a3b4d; color: #dce6f2;
    border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit;
  }
  input { flex: 1; }
  textarea { flex: 1; resize: vertical; min-height: 56px; }
  button {
    background: #07c160; border: 0; color: #fff; font-weight: 700;
    border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #06ad56; }
  .msg { font-size: 12px; color: #7fd8c8; margin-left: 10px; }
  .err { color: #ff8a80; }
  #topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  #reload { background: #223140; }
</style>
</head>
<body>
  <h1>GM 后台 · 主持工具</h1>
  <div class="sub">管理员权限：给玩家发放金币/道具/属性/等级进度/修为/抽奖券，改写角色档案。仅限本机使用。</div>
  <div id="topbar"><button id="reload">重新加载</button><span id="hint" class="msg"></span></div>

  <div class="card" id="grant-card">
    <div class="row1"><span class="nm">玩家面板 · 管理员发放</span>
      <span class="tag" id="pinfo">加载中…</span></div>
    <div class="fld"><label>系统金币</label><input type="number" id="g-gold" value="0" step="100">（可负数扣除）</div>
    <div class="fld"><label>抽奖券</label><input type="number" id="g-ticket" value="0" min="0" step="10"></div>
    <div class="fld"><label>发放道具</label>
      <select id="g-item"></select>
      <input type="number" id="g-count" value="1" min="1" max="999" style="max-width:90px"></div>
    <div class="fld"><label>属性</label>
      <select id="g-stat">
        <option value="">（不调）</option><option>体魄</option><option>头脑</option>
        <option>情商</option><option>魅力</option>
      </select>
      <input type="number" id="g-statv" value="0" min="-99" max="99" style="max-width:90px"></div>
    <div class="fld"><label>等级进度</label><input type="number" id="g-prog" value="0" min="-100" max="100" step="5">%</div>
    <div class="fld"><label>修为</label><input type="number" id="g-power" value="0" min="0" max="999" step="10"></div>
    <div class="fld"><label></label><button id="grant-btn">执行发放</button><span id="grant-msg" class="msg"></span></div>
  </div>

  <div class="card" id="shop-card">
    <div class="row1"><span class="nm">商城与抽奖管理</span><span class="tag" id="shop-note">加载中…</span></div>

    <div class="fld"><label>货架轮换</label>
      <label style="flex:0"><input type="checkbox" id="r-enabled"> 启用</label>
      货架 <input type="number" id="r-slots" min="4" max="48" style="max-width:70px" value="14"> 件
      周期 <select id="r-period" style="max-width:110px"><option value="day">每游戏日</option><option value="slot">每时段</option></select>
    </div>
    <div class="fld"><label>常驻货架</label><input id="r-pinned" placeholder="商品名，逗号分隔（永远展示，不参与轮换）"></div>

    <div class="fld" style="margin-top:10px"><label></label><b style="color:#7fd8c8">上架自定义商品</b></div>
    <div class="fld"><label>名称</label><input id="c-name" maxlength="20">
      价格 <input type="number" id="c-price" min="1" max="9999" value="50" style="max-width:80px">
      分类 <select id="c-cat"><option>特殊</option><option>修炼</option><option>约会</option><option>情趣</option><option>穿搭</option><option>属性</option></select></div>
    <div class="fld"><label>描述</label><input id="c-desc" maxlength="40">
      效果 <select id="c-use"><option value="">（无 / 纪念品）</option><option value="progress">等级进度 +5</option><option value="progress10">等级进度 +10</option><option value="stat">属性 +1</option></select></div>
    <div class="fld"><label></label><button id="c-add">上架这件</button><span id="c-msg" class="msg"></span></div>
    <div id="c-list" class="msg"></div>

    <div class="fld" style="margin-top:10px"><label></label><b style="color:#7fd8c8">抽奖调整</b></div>
    <div class="fld"><label>品质权重</label>
      普通 <input type="number" id="w-0" min="0" max="1000" style="max-width:70px" value="70">
      稀有 <input type="number" id="w-1" min="0" max="1000" style="max-width:70px" value="24">
      史诗 <input type="number" id="w-2" min="0" max="1000" style="max-width:70px" value="5">
      传说 <input type="number" id="w-3" min="0" max="1000" style="max-width:70px" value="1"></div>
    <div class="fld"><label>奖池轮换</label>
      <label style="flex:0"><input type="checkbox" id="w-perday" checked> 每日从总池轮换子集</label></div>
    <div class="fld"><label></label><button id="shop-save">保存商城配置</button><span id="shop-msg" class="msg"></span></div>
  </div>

  <h1 style="margin-top:22px;font-size:16px">角色档案</h1>
  <div id="grid" class="grid"></div>
<script>
const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grid = document.getElementById("grid");
const hint = document.getElementById("hint");

async function loadRoster() {
  const r = await fetch("/api/gm/roster");
  const data = await r.json();
  grid.innerHTML = "";
  (data.npcs || []).forEach((n) => grid.appendChild(card(n)));
  hint.textContent = `共 ${data.npcs?.length || 0} 名角色`;
}

function card(n) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="row1">
      <span class="nm">${esc(n.name)}</span>
      <span class="tag">好感 ${n.affinity}</span>
      <span class="tag ${n.known ? "known" : ""}">${n.known ? "已登场" : "未登场"}</span>
      <span class="tag">${esc(n.place || "无常在地")}</span>
    </div>
    <div class="fld"><label>性格</label><textarea maxlength="200" data-k="persona">${esc(n.persona || "")}</textarea></div>
    <div class="fld"><label>身份</label><input maxlength="30" data-k="role" value="${esc(n.role || "")}"></div>
    <div class="fld"><label>礼物偏好</label><input maxlength="10" data-k="likes" value="${esc(n.likes || "")}"></div>
    <div class="fld"><label></label><button>保存</button><span class="msg"></span></div>`;
  el.querySelector("button").onclick = async () => {
    const get = (k) => el.querySelector(`[data-k="${k}"]`).value.trim();
    const msgEl = el.querySelector(".msg");
    msgEl.textContent = "保存中…"; msgEl.className = "msg";
    try {
      const r = await fetch("/api/gm/npc", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ npc: n.name, persona: get("persona"),
                               role: get("role"), likes: get("likes") }),
      });
      const d = await r.json();
      msgEl.textContent = d.result?.msg || (d.detail ? "失败：" + JSON.stringify(d.detail) : "失败");
      if (!d.result?.ok) msgEl.className = "msg err";
    } catch (e) {
      msgEl.textContent = "请求失败：" + e.message; msgEl.className = "msg err";
    }
  };
  return el;
}

document.getElementById("reload").onclick = loadRoster;
loadRoster();

/* ---- 商城与抽奖管理 ---- */
const $id = (i) => document.getElementById(i);

async function loadShopPanel() {
  try {
    const r = await fetch("/api/gm/shop");
    const d = await r.json();
    const cfg = d.config || {};
    const rot = cfg.rotation || {};
    $id("r-enabled").checked = rot.enabled !== false;
    $id("r-slots").value = rot.slots || 14;
    $id("r-period").value = rot.period || "day";
    $id("r-pinned").value = (cfg.pinned || []).join("，");
    const lot = cfg.lottery || {};
    const w = lot.weights || d.default_weights || {};
    ["普通", "稀有", "史诗", "传说"].forEach((q, i) => { $id("w-" + i).value = w[q] ?? 0; });
    $id("w-perday").checked = lot.per_day !== false;
    renderCustom(cfg.custom_items || []);
    $id("shop-note").textContent = "配置已加载";
  } catch (e) { $id("shop-note").textContent = "加载失败：" + e.message; }
}

let customItems = [];
function renderCustom(items) {
  customItems = items;
  $id("c-list").textContent = items.length
    ? "已上架：" + items.map((i) => `${i.name}(${i.price}金)`).join("、")
    : "（暂无自定义商品）";
}

$id("c-add").onclick = () => {
  const name = $id("c-name").value.trim();
  const price = parseInt($id("c-price").value, 10) || 10;
  const useSel = $id("c-use").value;
  const item = { name, desc: $id("c-desc").value.trim() || `${name}（管理员上架）`,
                 price, cat: $id("c-cat").value };
  if (useSel === "progress") item.use = { progress: 5 };
  if (useSel === "progress10") item.use = { progress: 10 };
  if (useSel === "stat") item.use = { stat: { 体魄: 1 } };
  if (!name) { $id("c-msg").textContent = "名称必填"; return; }
  const next = customItems.filter((i) => i.name !== name).concat(item);
  renderCustom(next);
  $id("c-msg").textContent = `已加入列表：${name}（点下方保存生效）`;
  $id("c-name").value = ""; $id("c-desc").value = "";
};

$id("shop-save").onclick = async () => {
  const msg = $id("shop-msg");
  msg.textContent = "保存中…"; msg.className = "msg";
  const body = {
    rotation: { enabled: $id("r-enabled").checked,
                slots: parseInt($id("r-slots").value, 10) || 14,
                period: $id("r-period").value },
    pinned: $id("r-pinned").value.split(/[,，]/).map((s) => s.trim()).filter(Boolean),
    custom_items: customItems,
    lottery: { weights: { 普通: +$id("w-0").value || 0, 稀有: +$id("w-1").value || 0,
                          史诗: +$id("w-2").value || 0, 传说: +$id("w-3").value || 0 },
               per_day: $id("w-perday").checked },
  };
  try {
    const r = await fetch("/api/gm/shop", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    msg.textContent = d.result?.msg || "失败";
    if (!d.result?.ok) msg.className = "msg err";
  } catch (e) { msg.textContent = "请求失败：" + e.message; msg.className = "msg err"; }
};
loadShopPanel();

/* ---- 玩家面板：管理员发放 ---- */
async function loadGrantPanel() {
  try {
    const [cat, st] = await Promise.all([
      fetch("/api/gm/catalog").then((r) => r.json()),
      fetch("/api/state").then((r) => r.json()),
    ]);
    const sel = document.getElementById("g-item");
    sel.innerHTML = (cat.items || []).map((n) => `<option>${n}</option>`).join("");
    document.getElementById("pinfo").textContent = st.exists ? "存档在线" : "尚无存档（先开局）";
  } catch (e) {
    document.getElementById("pinfo").textContent = "加载失败：" + e.message;
  }
}

document.getElementById("grant-btn").onclick = async () => {
  const msgEl = document.getElementById("grant-msg");
  msgEl.textContent = "发放中…"; msgEl.className = "msg";
  const num = (id) => parseInt(document.getElementById(id).value || "0", 10) || 0;
  try {
    const r = await fetch("/api/gm/grant", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        gold: num("g-gold"), ticket: num("g-ticket"),
        item: document.getElementById("g-item").value,
        item_count: Math.max(1, num("g-count")),
        stat: document.getElementById("g-stat").value,
        stat_value: num("g-statv"), progress: num("g-prog"), power: num("g-power"),
      }),
    });
    const d = await r.json();
    msgEl.textContent = d.result?.msg || (d.detail ? "失败：" + JSON.stringify(d.detail) : "失败");
    if (!d.result?.ok) msgEl.className = "msg err";
  } catch (e) {
    msgEl.textContent = "请求失败：" + e.message; msgEl.className = "msg err";
  }
};
loadGrantPanel();
</script>
</body>
</html>
