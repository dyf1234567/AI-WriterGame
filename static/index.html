<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双界录 · 都市修仙</title>
<link rel="stylesheet" href="/static/style.css?v=20261018-fixes3">
</head>
<body data-theme="night" data-mobile="story">

<header class="topbar">
  <div class="brand">
    <span class="brand-name">双界录</span>
    <span id="demo-badge" class="badge-demo" hidden
          title="未配置模型 API，当前为内置示例剧情。在项目根目录 .env 填入 LLM_BASE_URL / LLM_API_KEY / LLM_MODEL 并重启服务即可接入真实模型。">演示模式</span>
  </div>
  <div class="world-zone">
    <span class="world-chip" id="world-chip">都市</span>
    <button id="btn-cross" class="btn btn-ghost" title="随时穿梭两界（重大剧情节点可能被锁定）"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h13M13.5 3.5 17 7l-3.5 3.5M20 17H7M10.5 13.5 7 17l3.5 3.5"/></svg>穿越</button>
  </div>
  <div class="top-actions">
    <div class="theme-dots" title="点击切换界面风格（含夜间模式）">
      <button class="theme-dot" data-theme="night" style="--c:#54d6c8" title="深夜（夜间模式）"></button>
      <button class="theme-dot" data-theme="ink" style="--c:#e8e8e8" title="墨纸（夜间模式）"></button>
      <button class="theme-dot" data-theme="parchment" style="--c:#c9a86a" title="羊皮卷"></button>
      <button class="theme-dot" data-theme="qinglan" style="--c:#6fd3a7" title="青岚"></button>
    </div>
    <label class="toggle" title="显示 / 隐藏好感度数值">
      <input type="checkbox" id="chk-affinity"> <span>好感度</span>
    </label>
    <label class="toggle"><input type="checkbox" id="chk-typing" checked>逐字显示</label>
    <button id="btn-sys" class="btn btn-ghost" title="打开系统界面（状态 / 背包 / 商城 / 炼丹 / 任务）"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>系统</button>
    <button id="btn-new" class="btn btn-ghost">新游戏</button>
  </div>
</header>
<nav class="mobile-nav" aria-label="游戏面板">
  <button class="mobile-tab" data-panel="story" aria-pressed="true">剧情</button>
  <button class="mobile-tab" data-panel="status" aria-pressed="false">地图与状态</button>
  <button class="mobile-tab" data-panel="people" aria-pressed="false">人物与消息</button>
</nav>

<main class="grid">

  <!-- 左栏：地图 + 系统分格 -->
  <aside class="panel panel-left">
    <section class="card">
      <h3 class="card-title">◈ 地图</h3>
      <div id="map-now" class="map-now"></div>
      <div class="map-tabs" id="map-tabs">
        <button class="map-tab" data-world="urban">都市</button>
        <button class="map-tab" data-world="xianxia">修仙界</button>
      </div>
      <div id="map-canvas" class="map-canvas"></div>
      <p class="dim small map-legend">示意地图，不代表实际距离 · 点击查看地点</p>
    </section>

    <section class="card">
      <h3 class="card-title">◈ 修行面板</h3>
      <div class="realm-row">
        <span id="realm-name" class="realm-name">炼气</span>
        <span id="realm-progress-num" class="dim">5%</span>
      </div>
      <div id="identity-line" class="dim small" title="主角在各界的身份"></div>
      <div id="technique-line" class="dim small" title="初始功法，每人限领一次"></div>
      <div class="bar"><div id="realm-bar" class="bar-fill"></div></div>
      <div id="stats" class="stats"></div>
    </section>

    <section class="card">
      <h3 class="card-title">◈ 每日签到</h3>
      <button id="btn-signin" class="btn btn-accent full">今日签到</button>
      <p id="signin-hint" class="dim small">系统每日发放一次奖励：灵石 / 功法残页 / 修为灌顶。</p>
    </section>

    <section class="card">
      <h3 class="card-title">◈ 任务</h3>
      <div id="quest-main" class="quest-main"></div>
      <div id="quest-side"></div>
    </section>

    <section class="card">
      <h3 class="card-title">◈ 背包</h3>
      <div id="bag"></div>
    </section>
  </aside>

  <!-- 中栏：剧情阅读流 -->
  <section class="panel panel-center">
    <div class="reading-tools"><button id="btn-backups" class="chip">恢复存档</button><button id="btn-history" class="chip">往事回看</button><button id="btn-reveal" class="chip">立即显示全文</button></div>
    <div id="story-flow"></div>
    <div class="action-zone">
      <p id="busy-hint" role="status" aria-live="polite" hidden>正在推演，生成期间请稍候；失败后可重试，原进度会保留。</p>
      <div id="choices" class="choices"></div>
      <div class="quick-row">
        <button class="chip" data-qa="cultivate" title="打坐修炼，提升修为"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v3.5M12 17.5V21M3 12h3.5M17.5 12H21M6 6l2.4 2.4M15.6 15.6 18 18M18 6l-2.4 2.4M8.4 15.6 6 18"/><circle cx="12" cy="12" r="2.6"/></svg>修炼</button>
        <button class="chip" data-qa="explore" title="探索当前地点周边，可能揭示迷雾"><svg class="ic" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15.5 15.5 4.5 4.5"/></svg>探索此地</button>
        <button class="chip" data-qa="look" title="观察四周环境与人物"><svg class="ic" viewBox="0 0 24 24"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>查看四周</button>
      </div>
      <div class="input-row">
        <input id="free-input" type="text" maxlength="120" placeholder="……或者，写下你想做的任何事">
        <button id="btn-act" class="btn btn-accent">行 动</button>
      </div>
    </div>
  </section>

  <!-- 右栏：关系网 + 收件箱分格 -->
  <aside class="panel panel-right">
    <section class="card">
      <h3 class="card-title">◈ 关系网</h3>
      <div id="relations"></div>
    </section>
    <section class="card">
      <h3 class="card-title">◈ 收件箱 <span id="inbox-dot" class="dot" hidden></span></h3>
      <div id="inbox"></div>
    </section>
  </aside>
</main>

<!-- 地图大图查看界面 -->
<div id="map-modal" class="map-modal" role="dialog" aria-modal="true" aria-label="世界地图" hidden>
  <div class="map-modal-box">
    <div class="map-modal-head">
      <div class="map-tabs" id="map-tabs-big">
        <button class="map-tab" data-world="urban">都市</button>
        <button class="map-tab" data-world="xianxia">修仙界</button>
      </div>
      <div id="map-now-big" class="map-now"></div>
      <button id="map-modal-close" class="tab-close" title="关闭">✕</button>
    </div>
    <div id="map-canvas-big" class="map-canvas map-canvas-big"></div>
    <div id="map-detail" class="map-detail" hidden></div>
  </div>
</div>

<!-- 系统界面（状态 / 背包 / 任务） -->
<div id="sys-modal" class="overlay" role="dialog" aria-modal="true" aria-label="系统" hidden>
  <div class="sys-box">
    <div class="sys-head">
      <div class="sys-tabs">
        <button class="sys-tab active" data-tab="status">状态</button>
        <button class="sys-tab" data-tab="bag">背包</button>
        <button class="sys-tab" data-tab="shop">商城</button>
        <button class="sys-tab" data-tab="alchemy">炼丹</button>
        <button class="sys-tab" data-tab="quest">任务</button>
      </div>
      <button id="sys-modal-close" class="tab-close" title="关闭">✕</button>
    </div>
    <div class="sys-body">
      <section id="sys-tab-status" class="sys-pane active">
        <div class="realm-row">
          <span id="sys-realm-name" class="realm-name"></span>
          <span id="sys-realm-pct" class="dim"></span>
        </div>
        <div class="bar"><div id="sys-realm-bar" class="bar-fill"></div></div>
        <div id="sys-stats" class="stats"></div>
        <div class="npc-sec">◈ 装备栏</div>
        <div id="sys-equip" class="equip-grid"></div>
        <div class="sys-signin">
          <button id="sys-btn-signin" class="btn btn-accent full">今日签到</button>
          <p class="dim small">系统每日发放一次奖励：灵石 / 功法残页 / 修为灌顶。</p>
        </div>
      </section>
      <section id="sys-tab-bag" class="sys-pane">
        <div id="sys-bag" class="bag-grid"></div>
      </section>
      <section id="sys-tab-shop" class="sys-pane">
        <div id="sys-currency" class="map-now"></div>
        <div id="sys-shop" class="bag-grid"></div>
      </section>
      <section id="sys-tab-alchemy" class="sys-pane">
        <div class="map-now">丹房 · 材料合成丹药（莫老的丹方）</div>
        <div id="sys-alchemy" class="recipe-list"></div>
      </section>
      <section id="sys-tab-quest" class="sys-pane">
        <div id="sys-quest-main"></div>
        <div id="sys-quest-side"></div>
      </section>
    </div>
  </div>
</div>

<!-- NPC 详情弹窗 -->
<div id="npc-modal" role="dialog" aria-modal="true" aria-label="人物档案" hidden>
  <div class="npc-box">
    <div class="sys-head">
      <div id="npc-m-title"></div>
      <button id="npc-modal-close" class="tab-close" title="关闭">✕</button>
    </div>
    <div id="npc-m-body"></div>
  </div>
</div>

<!-- 新游戏弹窗 -->
<div id="modal" class="modal-mask" role="dialog" aria-modal="true" aria-labelledby="new-title" hidden>
  <div class="modal">
    <h2 id="new-title">开启新的故事</h2>
    <p class="dim">你是一名普通高三学生。某个晚自习，神秘系统降临——两个世界的大门，就此打开。</p>
    <label class="field">主角姓名
      <input id="inp-name" type="text" maxlength="12" value="林川">
    </label>
    <div class="modal-actions">
      <button id="btn-start" class="btn btn-accent">开始游戏</button>
      <button id="btn-cancel-new" class="btn btn-ghost">返回</button>
    </div>
  </div>
</div>
<div id="history-modal" class="overlay" role="dialog" aria-modal="true" aria-label="往事回看" hidden>
  <div class="sys-box">
    <div class="sys-head"><h2>往事回看</h2><button id="history-close" class="tab-close" aria-label="关闭往事">✕</button></div>
    <div id="history-body" class="sys-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/static/app.js?v=20261018-fixes3"></script>
</body>
</html>
